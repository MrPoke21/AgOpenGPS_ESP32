; PlatformIO Project Configuration File
;
; Default env: the firmware only. The [env:native] test env is run explicitly
; with "pio test -e native" and must not be built by a plain "pio run".
[platformio]
default_envs = esp32dev
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM5
lib_deps = 
	adafruit/Adafruit BNO08x@^1.2.5
	adafruit/Adafruit ADS1X15@^2.5.0
extra_scripts = pre:merge_bin.py

; Natív (PC) unit teszt a hardver-független IMU logikára (include/zImuLogic.h).
; Futtatás: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -I include
test_build_src = no
test_filter =
	test_imu_logic
	test_steer_guard
